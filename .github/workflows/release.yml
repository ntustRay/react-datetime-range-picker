name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
    paths:
      - package.json
      - .github/scripts/prepare-release.sh
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref_type == 'tag' && 'npm-release' || 'prepare-npm-release' }}
  queue: max

jobs:
  prepare:
    name: Prepare immutable release tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Dispatch the release for an unpublished version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/prepare-release.sh

  release-ref:
    name: Verify immutable release inputs
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag, version and main ancestry
        shell: bash
        run: |
          package_version="$(jq -er '.version' package.json)"
          stable='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$GITHUB_REF_NAME" =~ $stable || "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must be stable and match package.json version v$package_version."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME must point to a commit on main."
            exit 1
          fi

  quality:
    name: Release Quality (Node ${{ matrix.node }})
    needs: release-ref
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.18.0, 24.19.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run

  browser:
    name: Release Browser and Visual
    needs: release-ref
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run build
      - name: Install the browsers required by this repository
        id: browsers
        run: npm exec -- playwright install chromium firefox webkit
      - name: Record browser environment
        shell: pwsh
        run: |
          "ImageOS=$env:ImageOS`nImageVersion=$env:ImageVersion`nSHA=$env:GITHUB_SHA" | Out-File browser-environment.txt
          node --version | Out-File browser-environment.txt -Append
          npm --version | Out-File browser-environment.txt -Append
          npm exec -- playwright --version | Out-File browser-environment.txt -Append
          Get-FileHash "$env:WINDIR/Fonts/segoeui.ttf", "$env:WINDIR/Fonts/consola.ttf" | Format-List | Out-File browser-environment.txt -Append
      - run: npm run test:e2e
      - name: Visual comparisons
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: npm run test:visual
      - name: Upload browser reports and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-playwright-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            browser-environment.txt
          if-no-files-found: ignore
          retention-days: 7

  consumers:
    name: Release Packed React Consumers
    needs: release-ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run build
      - run: npm run test:consumers

  publish:
    name: Publish npm
    if: github.ref_type == 'tag'
    needs: [quality, browser, consumers]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run build
      - name: Publish package with Trusted Publishing
        shell: bash
        run: |
          package="$(jq -er '.name' package.json)"
          version="${GITHUB_REF_NAME#v}"
          endpoint="https://registry.npmjs.org/@ntustray%2freact-datetime-range-picker/$version"
          npm pack --ignore-scripts --json > "$RUNNER_TEMP/pack-result.json"
          archive=$(jq -er '.[0].filename' "$RUNNER_TEMP/pack-result.json")
          integrity=$(jq -er '.[0].integrity' "$RUNNER_TEMP/pack-result.json")
          status=$(curl --silent --show-error --retry 3 --connect-timeout 10 --max-time 20 \
            --output "$RUNNER_TEMP/npm-version.json" --write-out '%{http_code}' "$endpoint")
          case "$status" in
            200)
              if [[ "$(jq -er '.dist.integrity' "$RUNNER_TEMP/npm-version.json")" != "$integrity" ]]; then
                echo "::error::$package@$version exists but differs from the tagged build."
                exit 1
              fi
              echo "$package@$version was already published with the same integrity."
              ;;
            404) npm publish "./$archive" --access public --provenance --ignore-scripts ;;
            *) echo "::error::npm registry returned HTTP $status."; exit 1 ;;
          esac

  verify-npm:
    name: Verify published npm package
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global npm@11.17.0
      - name: Check the exact version in the public registry
        timeout-minutes: 4
        shell: bash
        run: |
          package="@ntustray/react-datetime-range-picker"
          version="${GITHUB_REF_NAME#v}"
          for attempt in {1..8}; do
            if npm view --prefer-online --fetch-retries=0 "${package}@${version}" version dist.tarball dist.integrity dist.attestations --json; then
              break
            fi

            if (( attempt == 8 )); then
              echo "::error::${package}@${version} is still unavailable from the npm registry after eight checks."
              exit 1
            fi

            delay=$((attempt * 5))
            echo "Waiting ${delay}s before checking npm registry metadata again (${attempt}/8)."
            sleep "$delay"
          done
          echo "Published package: [${package}@${version}](https://www.npmjs.com/package/${package}/v/${version})" >> "$GITHUB_STEP_SUMMARY"
      - name: Test the registry package with React 18 and 19
        shell: bash
        run: npm run test:consumers -- "${GITHUB_REF_NAME#v}"

  pages:
    name: Deploy release demo
    needs: verify-npm
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm run build
      - run: npm run demo:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: demo/dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  github-release:
    name: Create GitHub Release
    needs: pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract changelog entry
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -Eq "^## ${version} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          awk -v heading="## ${version} " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if draft="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft')"; then
            test "$draft" = "false"
            echo "Published release ${GITHUB_REF_NAME} already exists."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi
