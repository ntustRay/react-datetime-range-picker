name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-22:
    name: Node 22 Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run check

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run

  browser:
    name: Browser and Visual
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - name: Build current package before browser tests
        run: npm run build
      - name: Install the browsers required by this repository
        id: browsers
        run: npm exec -- playwright install chromium firefox webkit
      - name: Record browser environment
        shell: pwsh
        run: |
          "ImageOS=$env:ImageOS`nImageVersion=$env:ImageVersion`nSHA=$env:GITHUB_SHA" | Out-File browser-environment.txt
          node --version | Out-File browser-environment.txt -Append
          npm --version | Out-File browser-environment.txt -Append
          npm exec -- playwright --version | Out-File browser-environment.txt -Append
          Get-FileHash "$env:WINDIR/Fonts/segoeui.ttf", "$env:WINDIR/Fonts/consola.ttf" | Format-List | Out-File browser-environment.txt -Append
      - run: npm run test:e2e
      - name: Visual comparisons
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: npm run test:visual
      - name: Upload browser reports and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            browser-environment.txt
          if-no-files-found: ignore
          retention-days: 7

  consumers:
    name: Packed React Consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run build
      - run: npm run test:consumers
